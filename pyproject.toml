[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwire"
version = "0.2.1"
description = "GHOSTWIRE — Network Forensics Engine. The wire remembers everything."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Raphael Main"},
    {name = "Agent Mackenzie"},
]
keywords = ["network", "forensics", "pcap", "c2", "beacon", "detection", "cybersecurity", "ja4", "tls"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "scapy>=2.6",
    "dpkt>=1.9.8",
    # ja4plus: pin to a compatible range — a major bump could change the
    # parse_tls_handshake dict shape (keys: type/sni/ciphers/extensions/
    # supported_versions/version) that ja4_engine.py reads. Bump only after
    # re-verifying those keys in tests/test_fingerprint.py.
    "ja4plus>=0.5,<0.6",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ghostwire = "engine.cli:main"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter, not lint

[tool.ruff.lint.per-file-ignores]
# cli.py resolves the optional scapy dependency (try/except import + fallback
# class) before importing the engine, so the engine imports legitimately
# follow non-import code.
"engine/cli.py" = ["E402"]
# conftest builds PCAP fixtures and may have unused-by-some-fixtures imports.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
files = ["engine"]
# Third-party libs (scapy/dpkt/ja4plus) ship no stubs; we ship minimal partial
# stubs under typings/ (Phase 6.1) so the boundary is not blind. Drop the
# blanket ignore_missing_imports; mypy finds the stubs via mypy_path below.
mypy_path = ["typings"]

[[tool.mypy.overrides]]
# scapy.all populates IP/TCP/UDP/ICMP/Raw at runtime, so mypy reports
# attr-defined on the from-import lines. These files are the only ones that
# touch those dynamic attrs; disable attr-defined here only.
module = ["engine.parser.pcap_loader", "engine.fingerprint.ja4_engine", "engine.fingerprint.ja4h_engine", "engine.fingerprint.ja4ssh_engine"]
disable_error_code = ["attr-defined"]